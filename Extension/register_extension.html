<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles_extension.css" />
    <script src="renderer_extension.js"></script>
    <script src="register.js"></script>
  </head>
  <body>
    <section>
      <div class="register-box">
        <h2>Register for GateKeep</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" required/>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email"id="email" name="email" placeholder="Email" required/>
          </div>
          <div class="form-group">
            <label for="password">Master Password</label>
            <input type="password" id="password" name="password" placeholder="Master Password" required
              autocomplete="new-password"
            />
            <div class="password-strength">
              <div class="strength-bar" id="strength-bar"></div>
            </div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required/>
            <div id="password-match" class="password-match"></div>
          </div>
          <div class="form-group">
            <input type="checkbox" id="terms" required />
            <label for="terms">I agree to the Terms and Conditions</label>
          </div>
          <button type="submit" name="register" class="btn">Register</button>
        </form>
        <div class="link">
          <a href="login_extension.html">Already have an account? Log in here.</a>
        </div>
      </div>
    </section>
  </body>
</html>
