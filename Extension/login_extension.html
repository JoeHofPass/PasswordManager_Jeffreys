<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles_extension.css">
  <script src="renderer_extension.js"></script>
</head>
<body>
  <section>
    <div class="register-box">
      <h2>Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" required/>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required/>
          </div>
          <button type="submit" id="login" name="login" class="btn">Login</button>
        </form>
        <div class="link">
          <a href="register_extension.html">Don't have an account? Register here.</a>
        </div>
    </div>
  </section>
</body>
</html>
