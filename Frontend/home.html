<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateKeep - Dashboard</title>
    <link rel="stylesheet" href="style_home.css" />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="sidebar">
        <div class="logo">
          <img src="gatekeep4.png" alt="GateKeep Logo" class="logo-img" />
        </div>
        <ul>
          <li>
            <a href="home.html" class="active"
              ><i class="fas fa-key"></i> Passwords</a
            >
          </li>
          <li>
            <a href="alerts.html" id="securityAlerts"
              ><i class="fas fa-exclamation-triangle"></i> Security Alerts</a
            >
          </li>
          <li>
            <a href="deletedPasswords.html"
              ><i class="fas fa-trash"></i> Deleted</a
            >
          </li>
          <li>
            <a href="account.html"><i class="fas fa-user"></i> Account</a>
          </li>
          <li>
            <a href="logout.php"><i class="fas fa-sign-out-alt"></i> Logout</a>
          </li>
        </ul>
      </div>

      <div class="main-content">
        <header>
          <h2>Passwords</h2>
          <input type="text" id="searchBar" placeholder="Search passwords..." />
          <button class="btn-add" onclick="openPasswordPopup()">
            + ADD NEW PASSWORD
          </button>
        </header>

        <!-- Password List -->
        <section class="password-list">
          <h3>Stored Passwords</h3>
          <div class="accounts" id="accountList">
            <div class="account-card">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
                alt="Amazon"
                class="site-logo"
              />
              <div class="account-info">
                <strong>Amazon</strong>
                <p>user@example.com</p>
                <div class="password-container">
                  <input
                    type="password"
                    value="MySecurePass123!"
                    class="password-field"
                    readonly
                  />
                  <button
                    class="toggle-password"
                    onclick="togglePassword(this)"
                  >
                    👁
                  </button>
                </div>
              </div>
            </div>

            <div class="account-card">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/5/51/Google.png"
                alt="Google"
                class="site-logo"
              />
              <div class="account-info">
                <strong>Google</strong>
                <p>john.doe@gmail.com</p>
                <div class="password-container">
                  <input
                    type="password"
                    value="AnotherSecurePass!"
                    class="password-field"
                    readonly
                  />
                  <button
                    class="toggle-password"
                    onclick="togglePassword(this)"
                  >
                    👁
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Modern Pop-up Window -->
    <div id="passwordPopup" class="popup">
      <div class="popup-content">
        <span class="close-btn" onclick="closePasswordPopup()">×</span>
        <h2>Add a New Password</h2>
        <label>Website/App Name:</label>
        <input type="text" id="siteName" required />
        <label>Email/Username:</label>
        <input type="email" id="userEmail" required />
        <label>Password:</label>
        <input type="text" id="generatedPassword" />
        <button class="btn-generate" onclick="generatePassword()">
          Generate Password
        </button>
        <button class="btn-save" onclick="saveNewPassword()">
          Save New Password
        </button>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
