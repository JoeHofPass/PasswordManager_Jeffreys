<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateKeep - Register</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section>
      <div class="register-box">
        <h2>Register for GateKeep</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Full Name"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
              oninput="checkStrength()"
              autocomplete="new-password"
            />
            <div class="password-strength">
              <div class="strength-bar" id="strength-bar"></div>
            </div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm Password"
              required
              oninput="checkMatch()"
            />
            <div id="password-match" class="password-match"></div>
          </div>
          <div class="form-group">
            <label for="pin">Pin (6 digits)</label>
            <input
              type="text"
              id="pin"
              name="pin"
              placeholder="Enter 6-digit PIN"
              pattern="\d{6}"
              maxlength="6"
              required
              title="PIN must be exactly 6 digits"
              oninput="enforcePinLength(this)"
            />
          </div>

          <div
            class="form-group"
            style="display: flex; align-items: center; gap: 10px"
          >
            <input
              type="checkbox"
              id="terms"
              required
              style="width: 20px; height: 20px; accent-color: #00bfff"
            />
            <label for="terms" style="margin: 0; font-size: 0.95em">
              I agree to the
              <a
                href="#"
                onclick="openTerms(event)"
                style="color: #00bfff; text-decoration: underline"
              >
                Terms and Conditions
              </a>
            </label>
          </div>

          <script>
            function openTerms(event) {
              event.preventDefault();
              window.location.href = "terms.html";
            }
          </script>

          <button type="submit" name="register" class="btn">Register</button>
        </form>
        <div class="link">
          <a href="login.html">Already have an account? Log in here.</a>
        </div>
      </div>
    </section>

    <script>
      function checkStrength() {
        const password = document.getElementById("password").value;
        const strengthBar = document.getElementById("strength-bar");

        let strength = 0;
        if (password.length >= 8) strength += 25;
        if (/[A-Z]/.test(password)) strength += 25;
        if (/[0-9]/.test(password)) strength += 25;
        if (/[^A-Za-z0-9]/.test(password)) strength += 25;

        strengthBar.style.width = strength + "%";
        strengthBar.style.backgroundColor =
          strength < 50 ? "#e74c3c" : strength < 75 ? "#f1c40f" : "#2ecc71";
      }

      function checkMatch() {
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirm-password").value;
        const passwordMatch = document.getElementById("password-match");

        if (password.length === 0 || confirmPassword.length === 0) {
          passwordMatch.style.display = "none";
          return;
        }

        if (password === confirmPassword) {
          passwordMatch.textContent = "✅ Passwords match";
          passwordMatch.className = "password-match match";
          passwordMatch.style.display = "block";
        } else {
          passwordMatch.textContent = "❌ Passwords do not match";
          passwordMatch.className = "password-match nomatch";
          passwordMatch.style.display = "block";
        }
      }

      function enforcePinLength(input) {
        input.value = input.value.replace(/[^0-9]/g, "").slice(0, 6);
      }
    </script>

    <script src="renderer.js"></script>

    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
    </div>
  </body>
</html>
