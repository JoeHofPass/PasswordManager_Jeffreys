<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateKeep - Deleted Passwords</title>
    <link rel="stylesheet" href="style_home.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script> -->
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="logo">
          <img src="gatekeep4.png" alt="GateKeep Logo" class="logo-img" />
        </div>
        <ul>
          <li>
            <a href="home.html"><i class="fas fa-key"></i> Passwords</a>
          </li>
          <li>
            <a href="alerts.html"
              ><i class="fas fa-exclamation-triangle"></i> Security Alerts</a
            >
          </li>
          <li>
            <a href="deletedPasswords.html" class="active"
              ><i class="fas fa-trash"></i> Deleted</a
            >
          </li>
          <li>
            <a href="settings.html"><i class="fas fa-user"></i> Settings</a>
          </li>
          <li>
            <a href="login.html" onclick="logout()"
              ><i class="fas fa-sign-out-alt"></i> Logout</a
            >
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <header>
          <h2>Deleted Passwords</h2>
          <input type="text" id="searchBar" placeholder="Search passwords..." />
        </header>

        <!-- Recently Deleted List -->
        <section class="deleted-passwords cyber-section">
          <h3>Recently Deleted (Last 30 Days)</h3>
          <div class="accounts" id="deletedList">
            <!-- Hardcoded Passwords for Demo -->
          </div>
        </section>
      </div>
    </div>

    <!-- Recovery/Deletion Confirmation Modal -->
    <div id="restore-confirmation" class="modal hidden">
      <div class="modal-content">
        <h3>Are you sure you want to restore this password?</h3>
        <button id="confirmBtn">Yes</button>
        <button id="cancelBtn" onclick="closeModal()">No</button>
      </div>
    </div>

    <script src="deletedPasswords.js"></script>
    <script src="renderer.js"></script>

    <div id="pin-modal" class="modal-overlay">
      <div class="modal-content">
        <h2>Enter Security PIN</h2>
        <input type="password" id="pin-input" maxlength="6" placeholder="••••"/>
        <div class="modal-buttons">
          <button onclick="submitPIN()">Submit</button>
          <button onclick="cancelPIN()">Cancel</button>
        </div>
        <p id="pin-error" class="error-message hidden">
          Incorrect PIN. Try again.
        </p>
      </div>
    </div>
    <script src="watchDog.js"></script>
  </body>
</html>
